name: apply-microsite-wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply wiring
        run: python scripts/apply_microsite_patch.py
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx scripts/apply_microsite_patch.py .github/workflows/apply-microsite-wiring.yml
          git diff --cached --quiet || git commit -m "feat: wire seller microsite into app"
          git push
