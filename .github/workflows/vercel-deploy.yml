name: NammaSpot Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy prebuilt output to Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --scope="madhumithaut10-5925s-projects"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="madhumithaut10-5925s-projects"
          vercel deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="madhumithaut10-5925s-projects"
